<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Kids - Mapa</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="carregarHub()">
    <main class="container">
        <header class="painel-status">
            <h2 id="hub-idade">Idade: --</h2>
            <div class="saldo-box">
                <span>Moedas:</span>
                <span id="hub-saldo" class="valor-moeda">0</span>
            </div>
        </header>

        <section class="card mapa-missoes">
            <h2>Suas Missões</h2>
            
            <div id="card-missao-1" class="missao-item ativa">
                <h3 id="titulo-missao-1">Carregando...</h3>
                <p id="desc-missao-1">Aguarde...</p>
                <button id="btn-missao-1" class="btn-bloco grama" onclick="irParaMissao(1)">Jogar Missão 1</button>
            </div>

            <div id="card-missao-2" class="missao-item bloqueada">
                <h3 id="titulo-missao-2">Missão 2: Em Breve</h3>
                <p id="desc-missao-2">Complete a Missão 1 para liberar.</p>
                <button id="btn-missao-2" class="btn-bloco pedra" onclick="irParaMissao(2)" disabled>Bloqueado</button>
            </div>
        </section>
        
        <button class="btn-link" onclick="sair()">Sair do Jogo</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
